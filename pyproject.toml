[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "uribo-mcp"
version = "0.1.0"
description = "Local MCP server for Kobe University (Faculty of System Informatics) course and campus information"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "uriboMCP contributors" }]
dependencies = [
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "filelock>=3.16",
  "google-api-python-client>=2.160",
  "google-auth-httplib2>=0.2",
  "google-auth-oauthlib>=1.2",
  "keyring>=25.5",
  "mcp>=1.27,<2",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "Pillow>=11.0",
  "python-docx>=1.1",
  "python-dotenv>=1.0",
  "python-pptx>=1.0",
  "requests>=2.32",
  "selenium>=4.27",
]

[project.urls]
Repository = "https://github.com/AkiraAsano-kobe-u/uriboMCP"
Issues = "https://github.com/AkiraAsano-kobe-u/uriboMCP/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
uribo-mcp = "uribo_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uribo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702"]
